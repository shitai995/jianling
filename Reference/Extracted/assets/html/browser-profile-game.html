<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>玩过的游戏_QQ游戏</title>
<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />
</head>
<body>
  <section>
  	<h1 class="achievement-title">的游戏</h1>
    <script type='text/tmpl' id='tmpl-achievement-list-game'>
   	  	<li onclick="window.location = 'browser-game-item.html?sid=<#= sid #>&cpId=<#= game.cpId #>&gameId=<#= game.gameId #>'">
       	  <figure>
           	  <a class="icon-shine"><img src="<#= p_util.getLogoUrl(game.logo) #>" alt="<#= game.name #>" width="62" height="62"></a>
          <figcaption>
           	    <h1><a><#= game.name #></a></h1>
				<p>
					<#if( p_pkg.checkApk(game.pkgName) ){#>
				  		<a href='#' class="btn-blue" onClick="p_pkg.startGame(<#= game.cpId #>, <#= game.gameId #>,'<#= game.pkgName #>'); return false;" ><# if(p_pkg.isCurGame(game.cpId, game.gameId, game.pkgName)) { #>返回<# }else{ #>开始<# } #></a>
					<#}else{#>
				  		<a href='<#=game.downUrl#>' class="btn-green">下载</a>
					<#}#>
				</p>
				<p>
					<span class="t-gray">达成<#= (userScoreList.length>0 ? userScoreList[0].achNum : 0) #>个成就(共<#= game.achNum #>个)</span>
				</p>
                <p><span class="badge"><#= (userScoreList.length>0 ? userScoreList[0].score : 0) #>分</span></p>
              </figcaption>
        </figure>
      </li>

	</script>
    <ul class="achievement-list-game">
    </ul> 
   	<div class="get-more"><a class="btn-getmore">查看更多</a></div>  
   	<section class="nodata-wrapper nodata-line" style="display: none;">
      <p class="warn">暂无好友的游戏信息</p>
	</section>
</section>


  <!-- ^^^ 公用js -->
  <script type="text/javascript" src='comm_js/jquery-1.5.1.js'></script>
  <script type="text/javascript" src='comm_js/LoadingCircular.js'></script>
  <script type="text/javascript" src='comm_js/js-tmpl-min.js'></script>
  <script type="text/javascript" src='comm_js/util.js'></script>
  <script type="text/javascript" src='comm_js/game-util.js'></script>
 <script type="text/javascript" src='comm_js/pkg.js'></script>
  <script type="text/javascript" src='comm_js/update.js'></script>
  
  
  <script type="text/javascript" src='js/profile-game.js'></script>
</body>
</html>
