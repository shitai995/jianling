<html>
<head>

<link rel="stylesheet" href="http://3gimg.qq.com/wap30/css/ptlogin/mainlogin.css">
<link rel="stylesheet" href="http://3gimg.qq.com/wap30/css/ptlogin/bid_default.css">
<script>
    const BID = "default"; 
    const BACKURL = "http://wap.wenwen.soso.com/iphone/index.jsp";
</script>
<script type="text/javascript" src="http://3gimg.qq.com/wap30/js/ptlogin/md5.min.js"></script>
<script type="text/javascript" src="http://3gimg.qq.com/wap30/js/ptlogin/login.min.js"></script>
</head>
<body class="unilogin">
    <div id="ptlogin-container">
	    <h1 id="title">手机腾讯网-登录</h1>
	    <form onsubmit="return false;">
	        <fieldset class="loginfiled">
	            <p><label>QQ号码</label><input type="text" id="ptlogin-name"><a class="empty" style="display:none;">清除</a></p>
	            <p><label>QQ密码</label><input type="password" id="ptlogin-password"><a class="empty" style="display:none;">清除</a></p>
	        </fieldset>
	        <div class="varify-wrapper" style="display:none">
            <div class="img-varify">
                <div><img width="110" height="38"></div>
                <input id="ptlogin-imgVerify" type="text">
            </div>
            </div>
	        <p><input id="ptlogin-submit" class="btn-login" type="submit" value="登   录"></p>
	    </form>
	    <p style="text-align:right;"><label><a href="/vandroid/center.html">返回QQ游戏首页</a></label></p>
    </div>
    <div class="common-box box-sm" id="ptlogin-prompt" style="display:none">
        <h2>无法登录</h2>
        <h3 class="bd-bm-bk" id="login-errmsg"></h3>
        <div class="btn-md bd-tp-be"><input id="ptlogin-relog" class="btn-login" type="button" value="重   试"></div>
    </div>
    <div class="load-box" style="display:none;">
        正在登录. . .
    </div>
    <div class="bg-shadow" id="ptlogin-lock" style="display:none;position:absolute"></div>
</body>
</html>
