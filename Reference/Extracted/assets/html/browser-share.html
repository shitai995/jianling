<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>分享_QQ游戏</title>
<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />

</head>
<body>




<script type="text/javascript" src='comm_js/util.js'></script>
<script type="text/javascript" src='comm_js/game-util.js'></script>
<script type="text/javascript">
p_util.loginIfNotHasSid();
</script>

  <section>    
  	<h1 class="achievement-title">分享给好友</h1>      

     <script type='text/tmpl' id='tmpl-player-list'>
   	  <li id="li-<#= uin #>">
       	  <figure>
           	  <a href="browser-profile.html?sid=<#= sid #>&uin=<#= uin #>" class="icon-shine"><img src="<#= p_util.getAvatarUrl(avtarImage) #>" alt="<#= avtarImage #>" width="44" height="44"></a>
              <figcaption>
           	    <h1><a href="browser-profile.html?sid=<#= sid #>&uin=<#= uin #>"><#= nickName #></a></h1>
                <#if(gameName != ""){#>	
                <p>最近在玩 <span class="t-deepgray"><#= gameName #></span></p>
                <#}#>
                <p><a class="check-box" id="<#= uin #>" name="<#= nickName #>" onclick='javascript: onClickBox(this); return false;'>选择</a></p>
			  </figcaption>
        </figure>
      </li>
     </script>
     <ul class="player-share-list">
    </ul>
    
       <div class="get-more" id="get-more">
		<a class="btn-getmore"  onclick='javascript: return false;'>查看更多</a>
	  </div>
      
      <div class="get-more" id="share">
		<a class="btn-getmore"  onclick='javascript: return false;'>分享给好友</a>
	  </div>

</section>

  <!-- ^^^ 公用js -->
  <script type="text/javascript" src='comm_js/jquery-1.5.1.js'></script>
  <script type="text/javascript" src='comm_js/LoadingCircular.js'></script>
  <script type="text/javascript" src='comm_js/js-tmpl-min.js'></script>
  <script type="text/javascript" src='comm_js/util.js'></script>
  <script type="text/javascript" src='comm_js/game-util.js'></script>
 <script type="text/javascript" src='comm_js/pkg.js'></script>
  <script type="text/javascript" src='comm_js/update.js'></script>
  
  
  <script type="text/javascript" src='js/share.js'></script>
</body>
</html>
