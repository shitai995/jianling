<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>好友、陌生人的成就_QQ游戏</title>
<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />
</head>
<body>
<section>
  <h1 class="headline" id="achievement-title">的成就</h1>
  <script type='text/tmpl' id='tmpl-ach-list'>
    <tr>
      <td><a href="game-item.html?sid=<#= sid #>&cpId=<#= game.cpId #>&gameId=<#= game.gameId #>"><#= game.name #></a><span class="t-gray">已解锁成就<#= (userScoreList.length>0 ? userScoreList[0].achNum : 0) #> 个</span></td>
      <td class="badge-info"><span><#= (userScoreList.length>0 ? userScoreList[0].score : 0) #></span></td>
      <td class="badge-info t-ora"><span><#= (userScoreList.length>1 ? userScoreList[1].score : 0) #></span></td>
    </tr>
  </script>
  <table class="achievement-table" border="0" cellspacing="0" cellpadding="0">
    <tr>
      <th scope="col">游戏名称</th>
      <th scope="col" id="otherNickName"></th>
      <th scope="col" >我</th>
    </tr>
  </table>
       <div class="get-more">
		<a class="btn-getmore"  onclick='javascript: return false;'>查看更多</a>
	  </div>
	  
	<section class="nodata-wrapper" style="display: none;">
      	<p class="warn">该玩家暂无游戏成就信息。</p><br />
	</section>
</section>

  <!-- ^^^ 公用js -->
  <script type="text/javascript" src='comm_js/jquery-1.5.1.js'></script>
  <script type="text/javascript" src='comm_js/LoadingCircular.js'></script>
  <script type="text/javascript" src='comm_js/js-tmpl-min.js'></script>
  <script type="text/javascript" src='comm_js/util.js'></script>
  <script type="text/javascript" src='comm_js/game-util.js'></script>
 <script type="text/javascript" src='comm_js/pkg.js'></script>
  <script type="text/javascript" src='comm_js/update.js'></script>
  
  
  <script type="text/javascript" src='js/profile-achievement.js'></script>

</body>
</html>
