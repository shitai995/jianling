<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>游戏详情_QQ游戏</title>
<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />

</head>
<body>

<script type="text/javascript" src='comm_js/util.js'></script>
<script type="text/javascript" src='comm_js/game-util.js'></script>
<script type="text/javascript">
if(typeof(window.comtencentwebnetJavaScript) != "undefined") {
	//p_util.loginIfNotHasSid();
}
</script>


  <section class="game-item">
  	<section class="game-title">
  	  <script type='text/tmpl' id='tmpl-game-title'>
    	<figure>
            	<a href="#" class="icon-shine"><img src="<#= p_util.getLogoUrl(gameInfo.logo) #>" alt="<#= gameInfo.name #>" width="62" height="62"></a>
                <figcaption>
                	<h1><a href="#"><#= gameInfo.name #></a></h1>
				<p>
                    <!--未体验过游戏-->
				<#if(!hasPlayed && !p_pkg.isCurGame(gameInfo.cpId, gameInfo.gameId, gameInfo.pkgName)){#>
					<!-- 
                    <span class="grade"><span class="grade-0" style="width: <#= gameInfo.score #>0%;">分</span></span><br>
                  	<span class="t-gray s-12">(<#= gameInfo.scoreUserCount #>人评分)</span>
					-->
					<a class="btn-getmore" href="browser-game-mark.html?cpId=<#= gameInfo.cpId #>&gameId=<#= gameInfo.gameId #>&sid=<#= sid #>">查看评论</a>
                <#}else{#>
                    <!--体验过游戏-->
                  	<a class="btn-getmore" href="browser-share.html?cpId=<#= gameInfo.cpId #>&gameId=<#= gameInfo.gameId #>&sid=<#= sid #>">推荐给好友</a>
                <#}#>
				<#if( p_pkg.checkApk(gameInfo.pkgName) ){#>
				  <a href='#' onClick="p_pkg.startGame(<#= gameInfo.cpId #>, <#= gameInfo.gameId #>, '<#= gameInfo.pkgName #>'); return false;" class="btn-green"><# if(p_pkg.isCurGame(gameInfo.cpId, gameInfo.gameId, gameInfo.pkgName)) { #>返回游戏<# }else{ #>开始游戏<# } #></a>
				<#}else{#>
				  <a href="javascript:void(0);" onClick="p_util.reportAndDownload('<#= gameInfo.downUrl#>', '<#= gameInfo.name#>', '<#= gameInfo.pkgName#>', '<#= gameInfo.logo#>');return false;" class="btn-green">
					<#= gameInfo.enterGameStr #></a>
				<#}#>
				</p>
                </figcaption>
         </figure>
      </script>
      
      <figure>
            	<a href="#" class="icon-shine"><img src="" alt="loading..." width="62" height="62"></a>
                <figcaption>
                	<h1><a href="games-list.html">loading...</a></h1>
                    <!--未体验过游戏-->
                    <p><span class="grade"><span class="grade-0"></span></span><br>
                  		<span class="t-gray s-12">(XX人评分)</span></p>
                  
                    <!--体验过游戏>
                  <p><a class="btn-getmore">推荐给好友</a></p-->
                  
                </figcaption>
         </figure>
    </section>
    
    <section class="pay" style="display: none;">   
    <p class="tips-confirm">活动推荐</p>
    </section>
    
    <section class="game-detail">
    
    <script type='text/tmpl' id='tmpl-game-detail'>
		
		<h1><a class="open">查看详情</a></h1>
          
        <ul id='w-game-detail-ul' style="display:block;">
              
			<# if(!p_pkg.isCurGame(cpId, gameId, pkgName)) { #>
        	<li class="game-preview">
            	<ul>
               	    <li class="on"><img src="<#= picList[0] #>" alt="0"></li>
                	<li><img src="" alt="1"></li>
                	<li><img src="" alt="2"></li>
                	
                </ul>
                <div class="preview-img-operation">
					<a class="preview-img-pre"><span>上一张</span></a>
					<ul>
						<li><a class="on">1</a></li><li><a>2</a></li><li><a>3</a></li>
					</ul>
					<a class="preview-img-next on"><span>下一张</span></a>
				</div>
            </li>
			<# } #>

        	<li><label class="inline-label">所属分类：</label><#= defaultTypeName #></li>
        	<# if(fileSize>0) {#><li><label class="inline-label">文件大小：</label><#= p_util.getFileSize(fileSize) #></li><# }#>
        	<# if(cpName!='') {#><li><label class="inline-label">开发商：</label><#=  cpName #></li><# }#>
        	<li><label class="inline-label">资费：</label><#= fee  #></li>
        	<li><label class="inline-label">上线时间：</label><time><#= pubTime  #></time></li>
        	<# if(downCount>0) {#><li><label class="inline-label">下载次数：</label><#= p_util.getDownCount(downCount) #></li><# }#>
        	<li>
            	<label class="block-label">游戏介绍：</label>
                <p><#= intro #></p>
            </li>

        </ul>
		
	</script>
    
        <h1><a href="#" class="open">查看详情</a></h1>
    <!--未展开状态> 
        <h1><a href="#">查看详情</a></h1-->
        
        <ul style="display:block;">
        <!--未展开状态> 
        <ul-->
        	<li class="game-preview">
            	<ul>
               	    <li><img src="" alt="图片1"></li>
                	<li><img src="" alt="图片2"></li>
                	<li><img src="" alt="图片3"></li>
                </ul>
                <div class="preview-img-operation"><a class="preview-img-pre"><span>上一张</span></a><ul><li><a class="on">1</a></li><li><a>2</a></li><li><a>3</a></li></ul><a class="preview-img-next on"><span>下一张</span></a></div>
			</li>
        	<li>
            	<label class="block-label">游戏介绍：</label>
                <p></p>
            </li>
                
        	<li><label class="inline-label">所属分类：</label></li>
        	<li><label class="inline-label">文件大小：</label></li>
        	<li><label class="inline-label">开发商：</label></li>
        	<li><label class="inline-label">资费：</label></li>
        	<li><label class="inline-label">上线时间：</label></li>
        	<li><label class="inline-label">下载次数：</label></li>
        
        </ul>
    </section>
    
  	<section class="game-operation" id="game-operation-1">
  		<ul class="operation-list">
  	  <script type='text/tmpl' id='tmpl-game-operation-1'>
			<# if(gameInfo.rankNum > 0){ #>
        	<li onclick='p_util.liClick(this);'>
                <h1><a href="browser-game-ranking.html?sid=<#= sid #>&cpId=<#= cpId #>&gameId=<#= gameId #>">分数排行</a></h1>
                <p><# if(userRank > 0){ #>您排在第<#= userRank #>位<# } #>(共<#= allPlayerNum #>位玩家)</p>
            </li>
			<#} if(gameInfo.achNum > 0){ #>
        	<li class="achievement" onclick='p_util.liClick(this);'>
                <h1><a href="browser-game-achievement.html?sid=<#= sid #>&cpId=<#= cpId #>&gameId=<#= gameId #>">游戏成就</a></h1>
                <p>已达成<#= achNum #>个成就(共<#= gameInfo.achNum #>个)
				<span class="badge"><#= achScore #></span></p>
            </li>
			<#}#>
 	  </script>
 	  </ul> 
    </section>
    
    <section class="feed-list">
	<h1>玩家动态</h1>
	  <ul>
		<script type='text/tmpl' id='tmpl-feed'>
		<li onclick="window.location = 'browser-profile.html?sid=<#= sid #>&uin=<#= uin #>'">
		  <figure>
			<a class="icon-shine"><img src="<#= p_util.getAvatarUrl(avatar) #>"  alt="<#= avatar #>" width="44" height="44"></a>
				<figcaption>
		<# if(type == ACTION_ID_GAIN_ACHIVEMENT){ #>
           	    <h1>恭喜<a><#= nickName #></a>在<a href="browser-game-item.html?cpId=<#= content.cpId #>&gameId=<#= content.gameId #>&sid=<#= sid #>"><#= gameName #></a>游戏中达成"<#= content.achName #>"成就。</h1>
                <p><img src="<#=  p_util.getAchLogoUrl(resId, content.achId)  #>" alt="<#= gameName #>" width="40" height="40"></p>

		<#} else if(type == ACTION_ID_BECOME_FRIEND){ #>
           	    <h1><a><#= nickName #></a>已和玩家<a href="browser-profile.html?sid=<#= sid #>&uin=<#= content.uin #>"><#= content.nickName #></a>成为朋友。 </h1>
                <p><a><img src="<#= p_util.getAvatarUrl(content.avatar) #>"  alt="<#= content.nickName #>" width="44" height="44"></a>
				</p>

		<#} else if(type == ACTION_ID_COMMENT_GAME ){ #>
           	    <h1><a><#= nickName #></a>对<a href="browser-game-item.html?cpId=<#= content.cpId #>&gameId=<#= content.gameId #>&sid=<#= sid #>"><#= gameName #></a>游戏发表的评论是：“<#= content.comment #>”。     </h1>

		<#} else if(type == ACTION_ID_GAIN_HIGH_SORT ){ #>
           	    <h1>恭喜<a><#= nickName #></a>在<a href="browser-game-item.html?cpId=<#= content.cpId #>&gameId=<#= content.gameId #>&sid=<#= sid #>"><#= gameName #></a>游戏中进入"<#= content.tagName #>"<#= extInfo #>前200位，现在排在第<#= content.userScoreList[0].rank #>位。</h1>
				<p><img src="img/tmp/icon-ranking.jpg" alt="<#= gameName #>" width="40" height="40">
				</p>
		<#} else if(type == ACTION_ID_SIGNATURE ){ #>
				<h1><a><#= nickName #></a>更新了签名：“<#= content.sign #>”。     </h1>
		<#}#>
                <p><time><#= addTime #></time></p>
			</figcaption>
          </figure>
		</li>
    	</script>
      </ul>
	  <div class="btn-wrapper clearfix" id="btn-all" style="display: none;">
	     <div class="btn-gray fl" id="btn-prev"><a href="#" onclick='javascript: return false;'>上一页</a></div>
	     <div class="btn-gray fl" id="btn-1st"><a href="#" onclick='javascript: return false;'>首页</a></div>
	     <div class="btn-gray fl" id="btn-next"><a href="#" onclick='javascript: return false;'>下一页</a></div>
	  </div>
    </section>
    
    <section class="nodata-wrapper" style="display: none;">
		<p class="warn">暂无动态</p>
	</section>
 
   	<section class="game-operation" id="game-operation-2">
  		<ul class="operation-list">
  	  <script type='text/tmpl' id='tmpl-game-operation-2'>
        	<li class="player" onclick='p_util.liClick(this);'>
                <h1><a href="browser-player-list.html?sid=<#= sid #>&cpId=<#= cpId #>&gameId=<#= gameId #>">看看谁在玩</a></h1>
                <p>共有<#= friendsNum #>位好友、<#= allPlayerNum #>位玩家</p>
            </li>
        	<li class="comments" onclick='p_util.liClick(this);'>
                <h1><a href="browser-game-mark.html?cpId=<#= cpId #>&gameId=<#= gameId #>&sid=<#= sid #>">评分、评论</a></h1>
                <p>共有<#= gameInfo.scoreUserCount #>位玩家评分、评论</p>
            </li>
 	  </script>
 	  </ul> 
    </section>
 
  </section>
    
  <!-- ^^^ 公用js -->
  <script type="text/javascript" src='comm_js/simple.min.js'></script>
  <script type="text/javascript" src='comm_js/LoadingCircular.js'></script>
  <script type="text/javascript" src='comm_js/LoadingPageBtn.js'></script>
  <script type="text/javascript" src='comm_js/js-tmpl-min.js'></script>
  <script type="text/javascript" src='comm_js/pkg.js'></script>
  <script type="text/javascript" src='comm_js/update.js'></script>
  
  
  <script type="text/javascript" src='js/game-item.js'></script>
  
  
  
  
</body>
