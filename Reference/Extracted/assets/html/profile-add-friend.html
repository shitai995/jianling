<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>我的信箱-好友请求_QQ游戏</title>
<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />
</head>
<body>
  <section class="profile-wrapper-add-friend">
  	<section class="profile">
    	<figure>
            	<a href="#" class="icon-shine"><img src="http://qlogo1.store.qq.com/qzone/12444904/12444904/100" alt="叉叉游戏" width="62" height="62"></a>
                <figcaption>
                	<h1>乞力马扎罗的雪(1234567890)</h1>
                    <!--未体验过游戏-->
                    <p>深圳地区<br>
                    <a href="#">最近在玩“植物大战僵尸”</a></p>
                </figcaption>
         </figure>
    </section>
    
  	<section class="profile-sign">
        <form>
            <input type="text" name="sign" value="不要迷恋哥，哥只是个传说">
        </form>
    </section>       
  	   
    <section>
	<ul class="request-operation">
        	<li><a href="#" class="btn-getmore">接受添加请求</a></li>
        	<li><a href="#" class="btn-getmore">拒绝添加请求</a></li>    
	  </ul>    	
    </section>
    
  	<section>
<ul class="profile-game-info">
        	<li><a href="#">我的好友<br><span>12位</span></a></li>
        	<li><a href="#">成就分数<br><span>12</span></a></li>
        	<li><a href="#" class="badge-info">玩过的游戏<br><span>12款</span></a></li>
	  </ul>    	
    </section>
    
  	<section class="game-operation">
		<ul class="getmore-list">
        	<li class="mail">
                <h1><a href="#">我的信箱</a></h1>
              <p>查看好友发送的信息和请求。</p>
            </li>
        	<li class="achievement">
                <h1>我的设置</h1>
                <p>共达成xx成就，成就总分：123</p>
            </li>
       	</ul>    
    </section>  
</section>
</body>
</html>
