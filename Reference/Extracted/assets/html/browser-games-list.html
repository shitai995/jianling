<!doctype html>
<html>

<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />
</head>
<body>
  <script type="text/javascript" src='comm_js/util.js'></script>
  <script type="text/javascript" src='comm_js/game-util.js'></script>
  <nav class="main-nav">
  	<ul>
    	<li><a href="browser.html">新品</a></li>
    	<li><a href="browser-hot.html">热门</a></li>
   	    <li><a href="browser-album.html">专辑</a></li>
        <li><a class="on" href="browser-game-category.html">分类</a></li>
        <li><a href="browser-game-search.html?num=10">搜索</a></li>
    </ul>
  </nav>
  <menu class="title">
    <ul class="sec-nav">
      <li><a class="cur" href="#">人气排行</a></li>
      <li><a href="#">新品上架</a></li>
      <li><a href="#">五星推荐</a></li>
    </ul>
    <h2 id="type">...</h2>
  </menu>
  <section>
  <script type='text/tmpl' id='tmpl-game'>
        <li onclick="window.location = 'browser-game-item.html?cpId=<#= cpId #>&gameId=<#= gameId #>&sid=<#= sid #>'">
        	<figure>
            	<a class="pic-show"><img src="<#= p_util.getLogoUrl(logo) #>" alt="<#= name #>" width="41" height="41"></a>
                <figcaption>
                	<h1><a><#= name #></a></h1>
					<p class="price"><#= fee #></p>
					<p class="online"><#if(downCount>0) {#><#= p_util.getDownCount(downCount) #>人<#} else {#>新上线游戏<#}#></p>
					<p class="time">上线: <#= pubTime #></p>
                </figcaption>
            </figure>
        </li>
  </script>
  <section class="game-category" id="w-game-list">
    <ul class="game-list">
    </ul>
  </section>
  </section>
  <div class="btn-wrapper clearfix" id="btn-all" style="display: none;">
     <div class="btn-light fl" id="btn-prev"><a href="#" onclick='javascript: return false;'>上一页</a></div>
     <div class="btn-light fl" id="btn-1st"><a href="#" onclick='javascript: return false;'>首页</a></div>
     <div class="btn-gray fl" id="btn-next"><a href="#" onclick='javascript: return false;'>下一页</a></div>
  </div>
  
    <!-- ^^^ 公用js -->
  <script type="text/javascript" src='comm_js/simple.min.js'></script>

  <script type="text/javascript" src='comm_js/pkg.js'></script>
  <script type="text/javascript" src='comm_js/update.js'></script>
  <script type="text/javascript" src='js/games-list.js'></script>
</body>
</html>
