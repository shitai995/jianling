<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>游戏排行榜_QQ游戏</title>
<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />

</head>
<body>




<script type="text/javascript" src='comm_js/util.js'></script>
<script type="text/javascript" src='comm_js/game-util.js'></script>
<script type="text/javascript">
p_util.loginIfNotHasSid();
</script>


  <section>
  
  	<h1 class="ranking-title">分数排行榜</h1>
    <ul class="ranking-list">
		<script type='text/tmpl' id='tmpl-score-types'>
		<li onclick="window.location = 'game-ranking-single.html?sid=<#= sid #>&cpId=<#= cpId #>&gameId=<#= gameId #>&scoreId=<#= tag #>'">
       	  <figure>
           	  <a class="icon-shine <#= (userScoreList.length>0 ? 'default' : 'lock') #>"><img src="img/tmp/icon-ranking.jpg" alt="叉叉游戏" width="40" height="40"></a>
              <figcaption>
           	    <h1><a><#= tagName #>排行榜</a></h1>
                <p><#= tagDetail #></p>
                <p class="score">你的分值<span class="t-ora"><#= (userScoreList.length>0 ? userScoreList[0].score : 0) #></span></p>
              </figcaption>
          </figure>
     	</li>
		</script>
    </ul> 
	
</section>

    
  <!-- ^^^ 公用js -->
  <script type="text/javascript" src='comm_js/jquery-1.5.1.js'></script>
  <script type="text/javascript" src='comm_js/LoadingCircular.js'></script>
  <script type="text/javascript" src='comm_js/js-tmpl-min.js'></script>
 <script type="text/javascript" src='comm_js/pkg.js'></script>
  <script type="text/javascript" src='comm_js/update.js'></script> 
  
  <script type="text/javascript" src='js/game-ranking.js'></script>
</body>
</html>
