<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>游戏搜索_QQ游戏</title>
<link rel="stylesheet" href="css/g.css" type="text/css">
<meta name="viewport" content="width=device-width; initial-scale=1.0; minimum-scale=1.0; maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="YES" />


</head>
<body>

	
<script type="text/javascript" src='comm_js/util.js'></script>
<script type="text/javascript" src='comm_js/game-util.js'></script>
<script type="text/javascript">
p_util.loginIfNotHasSid();
</script>

  <section>
      <menu id="main-nav">
        <ul class="sec-nav">
            <li id="friend"><a href="friends-list.html?typeId=1&cpId=-1&gameId=-1">我的好友</a></li>
          	<li id="nearby"><a href="friends-list.html?typeId=2&cpId=-1&gameId=-1" >附近玩家</a></li>
            <li id="search"><a class="cur" href="#">搜索好友</a></li>
        </ul>
      </menu>
      
      <form class="search">
      	<input name="keyword" id='keyword' type="number" value="请输入好友QQ号"><input type="submit" name="" value="">
      </form>
      <section class="no-search" style="display: none;"><p class="tips">未搜索到用户。</p></section>
       
       
	<section class="game-category">
    
     <script type='text/tmpl' id='tmpl-category-list'>
      
   	  <li onclick="window.location = 'profile.html?sid=<#= sid #>&uin=<#= uin #>'">
       	  <figure>
           	  <a class="icon-shine"><img src="<#= p_util.getAvatarUrl(avtarImage) #>" alt="<#= avtarImage #>" width="44" height="44"></a>
              <figcaption>
           	    <h1><a><#= nickName #></a></h1>
				
                <p><#if(gameName != ""){#>最近在玩 <span class="t-deepgray"><#= gameName #></span><# } #>&nbsp;</p>
				
                <p class="badge"><#= achScore #></p>
              </figcaption>
        </figure>
      </li>

	</script>
    
      <ul class="game-list">

      </ul>
      
       <div class="get-more" style='display: none;'>
		<a class="btn-getmore"  onclick='javascript: return false;'>查看更多</a>
	  </div>
  </section>
    	
      
  </section>
  
  
  
   
  <!-- ^^^ 公用js -->
  <script type="text/javascript" src='comm_js/jquery-1.5.1.js'></script>
  <script type="text/javascript" src='comm_js/LoadingCircular.js'></script>
  <script type="text/javascript" src='comm_js/js-tmpl-min.js'></script>
 <script type="text/javascript" src='comm_js/pkg.js'></script>
  <script type="text/javascript" src='comm_js/update.js'></script>
  
  
  <script type="text/javascript" src='js/friends-search.js'></script>
  
  
  
  
  
  
</body>
</html>
